<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>憨机炮</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;background:#0a0a0f;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
  .phone{width:390px;height:844px;background:#000;border-radius:48px;padding:10px;position:relative;
    box-shadow:0 0 0 2px #2a2a30,0 40px 80px rgba(0,0,0,.8)}
  .screen{position:relative;width:100%;height:100%;border-radius:40px;overflow:hidden;background:#f2f2f7}
  @media (max-width:430px),(max-height:880px){
    .phone{width:100vw;height:100dvh;border-radius:0;padding:0;box-shadow:none}
    .screen{border-radius:0}
  }
  ::-webkit-scrollbar{width:0;height:0}

  /* 状态栏 */
  .statusbar{position:absolute;top:0;left:0;right:0;height:48px;display:flex;align-items:center;
    justify-content:space-between;padding:0 28px;font-size:14px;font-weight:600;color:#1a1a1a;
    z-index:100;pointer-events:none}
  .sb-icons{display:flex;align-items:center;gap:6px}
  .sb-signal{display:inline-flex;gap:2px;align-items:flex-end;height:11px}
  .sb-signal i{width:3px;background:currentColor;border-radius:1px;display:block}
  .sb-signal i:nth-child(1){height:4px}.sb-signal i:nth-child(2){height:6px}
  .sb-signal i:nth-child(3){height:8.5px}.sb-signal i:nth-child(4){height:11px}
  .sb-battery{width:23px;height:11.5px;border:1.2px solid currentColor;border-radius:3.5px;
    padding:1.4px;position:relative}
  .sb-battery::after{content:'';position:absolute;right:-3.5px;top:3px;width:2px;height:4px;
    background:currentColor;border-radius:0 2px 2px 0}
  .sb-battery b{display:block;height:100%;width:72%;background:currentColor;border-radius:1px}

  /* 视图 */
  .view{position:absolute;inset:0;display:flex;flex-direction:column;background:#f2f2f7;
    opacity:0;pointer-events:none;transition:opacity .18s;z-index:1}
  .view.active{opacity:1;pointer-events:auto;z-index:2}

  /* ===== 桌面 ===== */
  #view-home{background:linear-gradient(160deg,#ffd9e8 0%,#f5d1f7 30%,#e3d0ff 60%,#d3c6ff 100%);
    padding-top:90px;align-items:center;overflow:hidden}
  #view-home::before,#view-home::after{content:'';position:absolute;border-radius:50%;filter:blur(50px);opacity:.55;pointer-events:none}
  #view-home::before{width:220px;height:220px;background:#ffb3d9;top:-60px;right:-60px}
  #view-home::after{width:260px;height:260px;background:#c4a8ff;bottom:-90px;left:-90px}
  .home-clock{text-align:center;color:#4a2a5a;position:relative;z-index:1}
  .hc-time{font-size:66px;font-weight:200;letter-spacing:2px;line-height:1}
  .hc-date{font-size:15px;color:rgba(74,42,90,.7);margin-top:8px}
  .app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 14px;width:100%;
    padding:0 24px;margin-top:56px;position:relative;z-index:1}
  .app{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
  .app-icon{width:62px;height:62px;border-radius:16px;display:flex;align-items:center;
    justify-content:center;font-size:30px;position:relative;
    box-shadow:0 6px 16px rgba(80,40,100,.22);transition:transform .14s}
  .app:active .app-icon{transform:scale(.9)}
  .app span{font-size:12px;color:#4a2a5a;font-weight:500}
  .app-badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;
    background:#ff3b30;color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;
    justify-content:center;padding:0 5px;border:2px solid #f7eaff}

  /* 导航 */
  .nav{flex-shrink:0;padding-top:48px;height:104px;display:grid;grid-template-columns:56px 1fr 56px;
    align-items:center;background:rgba(250,250,252,.94);backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);border-bottom:.5px solid rgba(0,0,0,.12);
    position:relative;z-index:10}
  .nav h1{font-size:17px;font-weight:600;margin:0;text-align:center}
  .nav-btn{width:56px;height:52px;border:none;background:none;font-size:24px;color:#ff6bb5;
    cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:400}
  .nav-btn:active{opacity:.45}

  /* ===== 信息 App ===== */
  #view-info{background:#fff}
  .tab-page{position:absolute;inset:0;display:none;flex-direction:column}
  .tab-page.active{display:flex}
  .tab-body{flex:1;overflow-y:auto;padding-bottom:74px}
  .scroll-body{flex:1;overflow-y:auto}

  .tabbar{position:absolute;bottom:0;left:0;right:0;height:64px;padding-bottom:env(safe-area-inset-bottom);
    background:rgba(250,250,252,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-top:.5px solid rgba(0,0,0,.12);display:flex;z-index:20}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;cursor:pointer;color:#9b9ba3;font-size:22px}
  .tab em{font-style:normal;font-size:10px}
  .tab.active{color:#ff6bb5}

  .chat-item{display:flex;gap:12px;padding:11px 16px;align-items:center;cursor:pointer;
    background:#fff;border-bottom:.5px solid #ededed;position:relative}
  .chat-item:active{background:#f5f5f8}
  .avatar{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:26px;flex-shrink:0;
    background:linear-gradient(180deg,#f6f6fa,#e6e6ee);
    box-shadow:inset 0 0 0 .5px rgba(0,0,0,.06)}
  .meta{flex:1;min-width:0}
  .row1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .name{font-size:16px;font-weight:600;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .time{font-size:12px;color:#b0b0b6;flex-shrink:0}
  .preview{font-size:14px;color:#8e8e93;margin-top:3px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .unread-badge{background:#ff3b30;color:#fff;font-size:12px;font-weight:600;
    min-width:20px;height:20px;border-radius:10px;padding:0 6px;display:flex;align-items:center;
    justify-content:center;flex-shrink:0}
  .empty-tip{text-align:center;color:#b6b6bd;font-size:14px;padding:60px 20px;line-height:1.8}

  /* 朋友圈 */
  .moment{display:flex;gap:12px;padding:14px 16px;background:#fff;
    border-bottom:.5px solid #f0f0f3}
  .moment .avatar{width:42px;height:42px;font-size:22px}
  .moment-body{flex:1;min-width:0}
  .moment-name{font-size:14px;font-weight:600;color:#4a5b8c}
  .moment-text{font-size:15px;color:#222;margin-top:5px;line-height:1.5;
    white-space:pre-wrap;word-break:break-word}
  .moment-foot{font-size:12px;color:#b0b0b6;margin-top:8px}

  /* 我 */
  .me-card{display:flex;align-items:center;gap:14px;padding:24px 20px;background:#fff}
  .me-card .avatar{width:64px;height:64px;font-size:32px}
  .me-name{font-size:20px;font-weight:600}
  .menu-list{background:#fff;margin-top:8px}
  .menu-item{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;
    font-size:15px;border-bottom:.5px solid #f0f0f3;cursor:pointer}
  .menu-item:active{background:#f7f7fa}
  .menu-val{color:#8e8e93;font-size:14px}

  /* ===== 聊天页 ===== */
  #view-chat{background:#f2f2f7}
  .chat-title{display:flex;align-items:center;justify-content:center;gap:8px;
    overflow:hidden;min-width:0;padding:0 4px}
  .chat-title .avatar{width:30px;height:30px;font-size:16px;flex-shrink:0}
  .cname{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .messages{flex:1;overflow-y:auto;padding:16px 12px 8px;display:flex;flex-direction:column;
    gap:12px;-webkit-overflow-scrolling:touch}
  .msg-row{display:flex;gap:8px;align-items:flex-end}
  .msg-row.me{flex-direction:row-reverse}
  .msg-row .avatar{width:32px;height:32px;font-size:17px}
  .bubble{max-width:72%;padding:9px 14px;border-radius:18px;font-size:15px;line-height:1.45;
    background:#fff;color:#111;border-bottom-left-radius:5px;
    box-shadow:0 1px 2px rgba(0,0,0,.07);word-break:break-word;white-space:pre-wrap}
  .msg-row.me .bubble{background:linear-gradient(180deg,#ff8fc6,#ff5fa8);color:#fff;
    border-bottom-left-radius:18px;border-bottom-right-radius:5px}
  .bubble.typing{display:flex;gap:4px;padding:14px 16px}
  .bubble.typing i{width:7px;height:7px;border-radius:50%;background:#c4c4cc;display:block;
    animation:bounce 1.2s infinite}
  .bubble.typing i:nth-child(2){animation-delay:.16s}
  .bubble.typing i:nth-child(3){animation-delay:.32s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.45}
    30%{transform:translateY(-5px);opacity:1}}
  .sys-msg{text-align:center;font-size:12px;color:#ff3b30;padding:2px 24px;line-height:1.6}

  .input-bar{flex-shrink:0;display:flex;gap:6px;align-items:center;
    padding:10px 10px calc(12px + env(safe-area-inset-bottom));
    background:rgba(250,250,252,.96);backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);border-top:.5px solid rgba(0,0,0,.12)}
  .input-bar input{flex:1;min-width:0;height:38px;border-radius:19px;border:1px solid #dcdce0;
    background:#fff;padding:0 14px;font-size:16px;outline:none;font-family:inherit}
  .input-bar input:focus{border-color:#ff6bb5}
  .input-bar button{height:38px;padding:0 13px;border-radius:19px;border:none;
    background:#ff6bb5;color:#fff;font-size:14px;font-weight:600;cursor:pointer;
    font-family:inherit;flex-shrink:0}
  .input-bar button#recvBtn{background:#8b5cf6}
  .input-bar button:disabled{opacity:.4}
  .input-bar button:active:not(:disabled){transform:scale(.95)}

  /* ===== 通用卡片/表单 ===== */
  .card{background:#fff;border-radius:14px;padding:4px 16px;
    box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .hint{font-size:12px;color:#a5a5ad;line-height:1.7;padding:8px 20px 0}
  .mfield{margin:12px 0}
  .mfield label{display:block;font-size:12px;color:#8e8e93;margin-bottom:6px}
  .mfield input,.mfield textarea,.mfield select{width:100%;border:1px solid #e2e2e8;
    border-radius:10px;padding:10px 12px;font-size:15px;font-family:inherit;outline:none;
    background:#fafafc;color:#111}
  .mfield textarea{resize:vertical;line-height:1.5}
  .mfield input:focus,.mfield textarea:focus,.mfield select:focus{border-color:#ff6bb5;background:#fff}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;height:36px;border-radius:8px;border:1px solid #e2e2e8;background:#fafafc;
    font-size:14px;font-family:inherit;cursor:pointer;color:#333}
  .seg button.active{background:#ff6bb5;border-color:#ff6bb5;color:#fff}
  .btn{width:100%;height:46px;border-radius:12px;border:none;background:#ff6bb5;color:#fff;
    font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;margin-top:8px}
  .btn:active{opacity:.85}
  .btn.secondary{background:#f2f2f7;color:#333}
  .btn.danger{background:#ff3b30}
  .check-list{display:flex;flex-direction:column;gap:8px}
  .check-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
    background:#fafafc;border:1px solid #e8e8ee;font-size:15px}
  .check-item input{width:18px;height:18px;accent-color:#ff6bb5}

  /* 世界书 */
  .wb-item{background:#fff;margin:10px 12px;padding:14px 16px;border-radius:12px;
    cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .wb-item:active{background:#fafafc}
  .wb-title{font-size:15px;font-weight:600;color:#111}
  .wb-meta{font-size:11px;color:#ff6bb5;margin-top:4px}
  .wb-content{font-size:13px;color:#8e8e93;margin-top:6px;line-height:1.5}

  /* ===== 模态框 ===== */
  .modal-mask{position:absolute;inset:0;background:rgba(0,0,0,.42);display:flex;
    align-items:flex-end;justify-content:center;z-index:300;opacity:0;pointer-events:none;
    transition:opacity .2s}
  .modal-mask.show{opacity:1;pointer-events:auto}
  .modal{width:100%;max-height:84%;background:#fff;border-radius:20px 20px 0 0;
    display:flex;flex-direction:column;transform:translateY(100%);
    transition:transform .26s cubic-bezier(.32,.72,0,1)}
  .modal-mask.show .modal{transform:translateY(0)}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;
    border-bottom:.5px solid #eee;flex-shrink:0}
  .modal-title{font-size:16px;font-weight:600}
  .modal-close{border:none;background
